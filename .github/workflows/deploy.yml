name: Seite bauen und veröffentlichen

on:
  push:
    branches: [main]
  schedule:
    # Mittwochnacht kurz nach dem Release. Folgen gehen um 23:45 Uhr deutscher Zeit raus,
    # der Lauf startet um 23:05 UTC = 00:05 Uhr (Winterzeit) bzw. 01:05 Uhr (Sommerzeit).
    - cron: '5 23 * * 3'
    # Sicherheitshalber jeden Morgen
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: node build.mjs
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
